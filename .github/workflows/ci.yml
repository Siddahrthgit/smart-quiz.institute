name: StudyPDF reliability CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studypdf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile if package metadata has drifted
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile repair to this same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Ensure main branch lockfile is already synchronized
        if: github.event_name != 'pull_request'
        run: git diff --exit-code -- package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Test local quiz engine
        run: npx tsx --test lib/localQuizEngine.test.ts
      - name: Build production app
        run: npm run build
      - name: Smoke-test production server, health, upload and local exam generation
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export PORT=3187
          export LOCAL_QUIZ_MODE=true
          export JWT_SECRET='ci-smoke-test-secret-at-least-32-bytes-long'
          export DATA_FILE="$RUNNER_TEMP/studypdf-ci-store.json"
          export UPLOADS_DIR="$RUNNER_TEMP/studypdf-ci-uploads"
          node dist/server.cjs >"$RUNNER_TEMP/studypdf-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3187/api/health >/tmp/studypdf-health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/studypdf-health.json
          curl --silent --show-error --fail http://127.0.0.1:3187/ -o /tmp/studypdf-home.html
          grep -q 'StudyPDF' /tmp/studypdf-home.html
          printf 'Concrete strength: compressive strength after curing. Soil compaction: increases dry density and reduces voids. Bearing capacity: soil resistance against foundation loads. Reinforced concrete: concrete combined with steel reinforcement.' > "$RUNNER_TEMP/sample-study.txt"
          curl --silent --show-error --fail -H "x-guest-id: ci-smoke-guest-session" -F "file=@$RUNNER_TEMP/sample-study.txt;type=text/plain" http://127.0.0.1:3187/api/upload -o /tmp/studypdf-upload.json
          DOC_ID=$(node -e "const x=require('/tmp/studypdf-upload.json'); if(!x.success || !x.document?.id) process.exit(1); process.stdout.write(x.document.id)")
          curl --silent --show-error -X POST http://127.0.0.1:3187/api/generate-quiz -H 'content-type: application/json' --data "$(DOC_ID="$DOC_ID" node -e "process.stdout.write(JSON.stringify({documentId:process.env.DOC_ID,numQuestions:4,questionTypes:['mcq']}))" )" -o /tmp/studypdf-quiz.json
          if [ -z "$DOC_ID" ]; then echo "Upload did not return a document ID"; exit 1; fi
          DOC_ID="$DOC_ID" node -e "const fs=require('fs'); const p='/tmp/studypdf-quiz.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!x.success || !Array.isArray(x.questions) || x.questions.length<1) { console.error(x); process.exit(1); } console.log('Local quiz generation passed with',x.questions.length,'questions.');"
          curl --silent --show-error -X POST http://127.0.0.1:3187/api/assistant/ask -H 'content-type: application/json' --data '{"message":"Explain bearing capacity in simple terms","webSearch":false}' -o /tmp/studypdf-assistant.json -w '%{http_code}' > /tmp/studypdf-assistant-status
          test "$(cat /tmp/studypdf-assistant-status)" = "503"
          grep -q 'GEMINI_API_KEY' /tmp/studypdf-assistant.json
          echo "StudyPDF production smoke tests passed."
